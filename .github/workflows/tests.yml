name: Synthetic correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            music_queue
            scripts
            tests
            evaluation
            docs
            .github
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest
      - run: black --check music_queue scripts tests evaluation/benchmark.py evaluation/catalog_benchmark.py evaluation/study.py
      - run: ruff check music_queue scripts tests evaluation/benchmark.py evaluation/catalog_benchmark.py evaluation/study.py
