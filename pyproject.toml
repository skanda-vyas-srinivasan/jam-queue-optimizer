[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-queue-optimizer"
version = "0.2.0"
description = "Validated shared music queues and reproducible optimization experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "pandas==2.3.3", "scikit-learn==1.7.2", "librosa==0.11.0", "plotly==6.3.1", "PuLP==3.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2", "hypothesis==6.141.1", "scipy==1.16.2"]
dev = ["black==25.9.0", "ruff==0.14.0"]

[tool.setuptools.packages.find]
include = ["music_queue*"]

[tool.setuptools.package-data]
music_queue = ["debug_panel/*.html", "debug_panel/*.css", "debug_panel/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"evaluation/*.py" = ["E402"]

[tool.ruff]
exclude = ["evaluation/audit"]
